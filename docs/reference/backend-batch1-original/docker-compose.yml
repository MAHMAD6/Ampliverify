services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ampliverify
      POSTGRES_USER: ampliverify
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - ampliverify_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ampliverify -d ampliverify"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ampliverify_pg:
